            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: PESQUISA_JA_RESPONDIDA
                mensagem: Você já respondeu esta pesquisa.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
