        **Privacidade / k-anonimato.** Quando `anonimo=true`, o resultado só é liberado se o número de participações concluídas for **≥ k** (valor mínimo configurado no servidor; o DDL não tem coluna para ele — ver pendências). Abaixo disso a resposta é 403 `K_ANONIMATO_NAO_ATINGIDO`, sem números parciais, para impedir identificação por subtração/diferença.

