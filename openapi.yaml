openapi: 3.0.3

info:
  title: Avalon System RH — ERP de Gestão de Pessoas e Saúde Organizacional
  description: >
    API REST para gestão integrada de Recursos Humanos, centralizando colaboradores, setores, cargos, jornadas,
    férias, benefícios, documentos, pesquisas, feedbacks, avaliações psicossociais, controle de acesso e auditoria.
    Convergência com o modelo lógico (DER) v1.1 — DER tratado como fonte de verdade para tipos, tamanhos e
    obrigatoriedade de campos.
  version: 1.1.0
  license:
    name: MIT

tags:
  - name: COLABORADOR
  - name: SETOR
  - name: CARGO
  - name: JORNADA
  - name: FÉRIA
  - name: BENEFICIO
  - name: DOCUMENTO
  - name: FEEDBACK
  - name: PESQUISA
  - name: INDICADOR
  - name: AVALIAÇÃO PSCICOSOCIAL
  - name: MOTOR DE REGRA
  - name: PLANOS DE AÇÃO
  - name: RELATÓRIO
  - name: NOTIFICAÇÃO
  - name: ACESSO
  - name: AUDITORIA

paths:

# =========================================
#                   COLABORADOR
# =========================================

  /v1/senai/avalon/colaborador:
    get:
      tags: [COLABORADOR]
      summary: Listar todos os colaboradores
      responses:
        '200':
          description: Lista de colaboradores retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Colaborador'
              example:
                - id: 1
                  id_setor: 1
                  id_cargo: 2
                  id_jornada_escala: 1
                  matricula: "COL001"
                  nome: "João da Silva"
                  cpf: "123.456.789-00"
                  data_nascimento: "1995-04-15"
                  email: "joao.silva@empresa.com"
                  telefone: "11987654321"
                  data_admissao: "2024-02-01"
                  data_desligamento: null
                  status: "Ativo"
        '404':
          description: Nenhum colaborador encontrado
        '500':
          description: Erro interno no servidor

    post:
      tags: [COLABORADOR]
      summary: Inserir novo colaborador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Colaborador'
            example:
              id_setor: 1
              id_cargo: 2
              id_jornada_escala: 1
              matricula: "COL001"
              nome: "João da Silva"
              cpf: "123.456.789-00"
              data_nascimento: "1995-04-15"
              email: "joao.silva@empresa.com"
              telefone: "11987654321"
              data_admissao: "2024-02-01"
              data_desligamento: null
              status: "Ativo"
      responses:
        '201':
          description: Colaborador inserido com sucesso
        '400':
          description: Dados inválidos no body
        '415':
          description: Content-Type inválido (esperado application/json)
        '500':
          description: Erro interno no servidor

  /v1/senai/avalon/colaborador/{id}:
    get:
      tags: [COLABORADOR]
      summary: Buscar colaborador por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Colaborador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Colaborador'
        '400':
          description: ID inválido
        '404':
          description: Colaborador não encontrado
        '500':
          description: Erro interno no servidor

    put:
      tags: [COLABORADOR]
      summary: Atualizar colaborador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Colaborador'
      responses:
        '200':
          description: Colaborador atualizado com sucesso
        '400':
          description: Dados inválidos
        '404':
          description: Colaborador não encontrado
        '415':
          description: Content-Type inválido
        '500':
          description: Erro interno no servidor

    delete:
      tags: [COLABORADOR]
      summary: Excluir colaborador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Colaborador excluído com sucesso
        '400':
          description: ID inválido
        '404':
          description: Colaborador não encontrado
        '500':
          description: Erro interno no servidor

