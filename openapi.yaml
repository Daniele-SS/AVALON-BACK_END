servers:
- url: http://localhost:3030
  description: Desenvolvimento local (ajustar porta)
- url: https://homologacao.avalon.example
  description: Homologação (placeholder — substituir pela URL real)
security:
- bearerAuth: []
tags:
- name: AUTENTICAÇÃO
  description: Login, renovação, logout no servidor, troca e recuperação de senha. Única parte pública da API.
- name: DASHBOARD
  description: Agregação da tela inicial por perfil.
- name: COLABORADOR
  description: Cadastro funcional, desligamento e visão "Minha Equipe".
- name: SETOR
  description: Unidades organizacionais; base do k-anonimato.
- name: CARGO
  description: Cargos e público-alvo.
- name: JORNADA E ESCALA
  description: Jornadas, horários e dias da semana.
- name: FÉRIAS
  description: Solicitação e aprovação em duas etapas (Gestor → RH).
- name: BENEFÍCIO
  description: Catálogo, elegibilidade por setor/cargo e concessões.
- name: DOCUMENTO
  description: Upload e consulta de documentos do colaborador (PDF).
- name: FEEDBACK
  description: Feedbacks de Gestor/RH e respostas do destinatário.
- name: PESQUISA
  description: Pesquisas de experiência com respostas anônimas e resultados sujeitos a k-anonimato.
- name: AVALIAÇÃO PSICOSSOCIAL
  description: Avaliações NR-1 por fatores; perguntas vêm dos fatores.
- name: FATOR PSICOSSOCIAL
  description: Cadastro dos 9 fatores e suas perguntas fixas.
- name: MOTOR DE REGRAS
  description: Regras de classificação de risco por fator.
- name: PLANO DE AÇÃO
  description: Planos e tarefas para tratar riscos identificados.
- name: INDICADOR
  description: Indicadores consolidados com supressão por k-anonimato.
- name: RELATÓRIO
  description: Relatórios gerais por período.
- name: NOTIFICAÇÃO
  description: Central de notificações do titular.
- name: USUÁRIO E ACESSO
  description: Contas, níveis (fixos) e menus (somente leitura).
- name: AUDITORIA
  description: Trilha imutável de ações (somente leitura, RH).
paths:
  /v1/senai/avalon/auth/login:
    post:
      tags:
      - AUTENTICAÇÃO
      operationId: authLogin
      summary: Autenticar e obter tokens de sessão
      description: |-
        Valida `login` + `senha` contra `tbl_usuario` e devolve o par de tokens, a identidade e os menus do nível.

        **Ordem de validação (importante para o Mobile 6.2.1):**
        1. Credenciais — login inexistente **e** senha errada retornam a *mesma* resposta 401 `CREDENCIAIS_INVALIDAS` (evita enumeração de usuários).
        2. Somente com credenciais corretas, verifica `tbl_colaborador.status`: `Inativo` (ou `data_desligamento` no passado) ⇒ 403 `CONTA_INATIVA`. O 403 só aparece para quem já provou conhecer a senha.
        3. Sucesso ⇒ grava `LOGIN` em `tbl_auditoria` (`entidade=tbl_usuario`).

        Web (RH/Gestor) e Mobile (Colaborador) usam este mesmo endpoint; o que muda é o `nivel_acesso` devolvido. Nenhum campo de senha ou hash aparece na resposta.

        **Autenticação:** rota pública (sem token).
      security: []
      x-perfis:
      - (público)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              login: carlos.oliveira
              senha: S3nh@Forte!2026
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResposta'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwibml2ZWwiOiJHZXN0b3IifQ.4Kq1
                token_type: Bearer
                expires_in: 900
                refresh_token: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
                usuario:
                  id: 2
                  login: carlos.oliveira
                  id_colaborador: 2
                  nome: Carlos Eduardo Oliveira
                  nivel_acesso:
                    id: 2
                    nome: Gestor
                    status: true
                menus:
                - id: 1
                  nome: Dashboard
                  icone: icon-dashboard
                  rota: /dashboard
                  ordem: 1
                - id: 9
                  nome: Feedbacks
                  icone: icon-feedbacks
                  rota: /feedbacks
                  ordem: 9
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Login ou senha incorretos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: CREDENCIAIS_INVALIDAS
                mensagem: Login ou senha inválidos.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
        '403':
          description: Credenciais corretas, porém o colaborador está `Inativo`/desligado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: CONTA_INATIVA
                mensagem: Esta conta está inativa. Procure o RH.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senai/avalon/auth/refresh:
    post:
      tags:
      - AUTENTICAÇÃO
      operationId: authRefresh
      summary: Renovar o access token
      description: |-
        Troca um `refresh_token` válido por um novo par de tokens. **Rotação obrigatória:** o refresh enviado é invalidado e um novo é devolvido. Reapresentar um refresh já consumido é tratado como roubo de credencial: toda a sessão é revogada e a resposta é 401 `TOKEN_INVALIDO`.

        Rechecagem: se o colaborador foi inativado ou o usuário removido desde o login, a renovação falha com 401 — assim a revogação de acesso vale em no máximo `expires_in` segundos.

        **Autenticação:** rota pública (sem token).
      security: []
      x-perfis:
      - (público)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
            example:
              refresh_token: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
      responses:
        '200':
          description: Novo par de tokens (mesmo formato do login).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResposta'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwibml2ZWwiOiJHZXN0b3IifQ.4Kq1
                token_type: Bearer
                expires_in: 900
                refresh_token: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
                usuario:
                  id: 2
                  login: carlos.oliveira
                  id_colaborador: 2
                  nome: Carlos Eduardo Oliveira
                  nivel_acesso:
                    id: 2
                    nome: Gestor
                    status: true
                menus:
                - id: 1
                  nome: Dashboard
                  icone: icon-dashboard
                  rota: /dashboard
                  ordem: 1
                - id: 9
                  nome: Feedbacks
                  icone: icon-feedbacks
                  rota: /feedbacks
                  ordem: 9
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh inexistente, expirado, já utilizado ou sessão revogada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: TOKEN_INVALIDO
                mensagem: Sessão inválida. Faça login novamente.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senai/avalon/auth/logout:
    post:
      tags:
      - AUTENTICAÇÃO
      operationId: authLogout
      summary: Encerrar sessão (invalida no servidor)
      description: |-
        Revoga **no servidor** o `access_token` do header (via `jti`, em lista de revogação até o `exp`) e o refresh token da sessão. Após esta chamada, qualquer requisição com o token antigo retorna 401 `TOKEN_INVALIDO` — não basta o cliente descartar o token (RF 5.1.38; viabiliza o TS04).

        Idempotente: chamar com token já revogado retorna 401 (token não é mais válido), o que o cliente deve tratar como "já deslogado". Grava `LOGOUT` em `tbl_auditoria`.

        **Perfis autorizados:** Colaborador, Gestor, RH.
      x-perfis:
      - Colaborador
      - Gestor
      - RH
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutInput'
            example:
              refresh_token: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
      responses:
        '204':
          description: Sessão encerrada. Corpo vazio.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senai/avalon/auth/me:
    get:
      tags:
      - AUTENTICAÇÃO
      operationId: authMe
      summary: Identidade e menus do usuário autenticado
      description: |-
        Devolve o mesmo bloco `usuario` + `menus` do login, sem emitir token. Use ao reabrir o app/aba para reconstruir a navegação sem pedir login de novo. Reflete o estado atual do banco (nível e status), não o do momento do login.

        **Perfis autorizados:** Colaborador, Gestor, RH.
      x-perfis:
      - Colaborador
      - Gestor
      - RH
      responses:
        '200':
          description: Identidade atual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioResumo'
                  menus:
                    type: array
                    items:
                      $ref: '#/components/schemas/Menu'
              example:
                usuario:
                  id: 2
                  login: carlos.oliveira
                  id_colaborador: 2
                  nome: Carlos Eduardo Oliveira
                  nivel_acesso:
                    id: 2
                    nome: Gestor
                    status: true
                menus:
                - id: 1
                  nome: Dashboard
                  icone: icon-dashboard
                  rota: /dashboard
                  ordem: 1
                - id: 9
                  nome: Feedbacks
                  icone: icon-feedbacks
                  rota: /feedbacks
                  ordem: 9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senai/avalon/auth/senha:
    put:
      tags:
      - AUTENTICAÇÃO
      operationId: authAlterarSenha
      summary: Alterar a própria senha (exige senha atual)
      description: |-
        Troca a senha do titular do token. Regras: `senha_atual` deve conferir com o hash (senão 422 `SENHA_ATUAL_INCORRETA`); `nova_senha` ≠ `senha_atual`; `confirmacao_nova_senha` idêntica. Em sucesso o servidor **revoga os refresh tokens das demais sessões** do usuário e mantém a sessão corrente. Grava `ATUALIZACAO` em `tbl_auditoria` sem registrar valores de senha. (Cobre o TS06.)

        **Perfis autorizados:** Colaborador, Gestor, RH.
      x-perfis:
      - Colaborador
      - Gestor
      - RH
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaInput'
            example:
              senha_atual: S3nh@Forte!2026
              nova_senha: N0va$enha#2026
              confirmacao_nova_senha: N0va$enha#2026
      responses:
        '204':
          description: Senha alterada. Corpo vazio.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          description: Senha atual incorreta, confirmação divergente ou nova senha fora da política.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: SENHA_ATUAL_INCORRETA
                mensagem: A senha atual está incorreta.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
                detalhes:
                - campo: senha_atual
                  problema: Não confere com a senha cadastrada.
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senai/avalon/auth/senha/esqueci:
    post:
      tags:
      - AUTENTICAÇÃO
      operationId: authEsqueciSenha
      summary: Solicitar link de recuperação de senha
      description: |-
        Inicia a recuperação: se existir usuário com o `login` e o colaborador estiver `Ativo`, envia ao `tbl_colaborador.email` um link com token de uso único. **A resposta é sempre 202**, existindo ou não o login — o cliente exibe "se a conta existir, você receberá um e-mail". (Cobre o TS07.)

        Limite de tentativas por login/IP é recomendado (429).

        **Autenticação:** rota pública (sem token).
