      type: object
      description: Dado cadastral e funcional da pessoa. Credenciais ficam em `Usuario`.
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        id_setor:
          type: integer
          description: Setor de lotação (FK `tbl_setor`).
          minimum: 1
          example: 2
        id_cargo:
          type: integer
          description: Cargo (FK `tbl_cargo`).
          minimum: 1
          example: 3
        id_jornada_escala:
          type: integer
          description: Jornada/escala vigente (FK `tbl_jornada_escala`).
          minimum: 1
          example: 1
        matricula:
          type: string
          description: Matrícula. **UNIQUE**.
          example: COL003
          maxLength: 12
        nome:
          type: string
          description: Nome completo.
          example: Rafael Martins
          maxLength: 255
        cpf:
          type: string
          description: 'CPF. **UNIQUE**, até 20 caracteres. Aceita com ou sem máscara; a regra de normalização antes de gravar não está definida no DDL — padronizar no Back-end (recomendado: só dígitos). **Dado pessoal (LGPD):** é retornado completo apenas ao RH e ao próprio titular; ao Gestor retorna mascarado (`***.456.789-**`).'
          example: 123.456.789-09
          maxLength: 20
        data_nascimento:
          type: string
          description: Data de nascimento. Opcional no banco.
          format: date
          example: '1995-04-15'
          nullable: true
        email:
          type: string
          description: E-mail corporativo. **UNIQUE**. Destino do link de recuperação de senha.
          format: email
          maxLength: 255
          example: rafael.martins@empresa.com.br
        telefone:
          type: string
          description: Telefone, somente dígitos com DDD recomendado.
          example: '11987654321'
          maxLength: 20
          nullable: true
        data_admissao:
          type: string
          description: Data de admissão.
          format: date
          example: '2026-02-02'
        data_desligamento:
          type: string
          description: Data de desligamento. Deve ser nula ou `>= data_admissao` (CHECK no banco).
          format: date
          example: null
          nullable: true
        status:
          type: string
          description: Situação cadastral. O CHECK do banco aceita **somente** `Ativo` e `Inativo`. Colaborador `Inativo` não consegue autenticar (login retorna 403 `CONTA_INATIVA`).
          enum:
          - Ativo
          - Inativo
          default: Ativo
          example: Ativo
        tipo_vinculo:
          type: string
          description: Tipo de vínculo empregatício. Nulo no banco (ENUM sem NOT NULL); recomenda-se torná-lo obrigatório no DDL.
          enum:
          - CLT
          - PJ
          - ESTÁGIO
          - JOVEM APRENDIZ
          - TEMPORARIO
          example: CLT
          nullable: true
        setor_nome:
          type: string
          description: Nome do setor (desnormalizado para listagem).
          example: Tecnologia da Informação
          readOnly: true
        cargo_nome:
          type: string
          description: Nome do cargo (desnormalizado para listagem).
          example: Desenvolvedor Full Stack
          readOnly: true
      required:
      - id
      - id_setor
      - id_cargo
      - id_jornada_escala
      - matricula
      - nome
      - cpf
      - email
      - data_admissao
      - status
