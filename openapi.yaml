    post:
      tags:
      - DOCUMENTO
      operationId: enviarDocumento
      summary: Enviar documento (upload)
      description: |-
        Recebe o arquivo e os metadados em `multipart/form-data`. O servidor valida tipo/tamanho, grava o binário em armazenamento privado, **gera** `caminho_arquivo` (padrão `/documentos/colaboradores/{id_colaborador}/{slug}.pdf`) e cria o registro. O cliente nunca informa caminho. Grava `CRIACAO` em auditoria.

        **Perfis autorizados:** RH.
      x-perfis:
      - RH
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentoUpload'
      responses:
        '201':
          description: Documento criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'
              example:
                id: 1
                id_colaborador: 1
                nome: Contrato de Trabalho - Ana Carolina Souza
                tipo_documento: Contrato
                caminho_arquivo: /documentos/colaboradores/1/contrato-trabalho.pdf
                ativo: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Arquivo maior que o limite do servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ARQUIVO_MUITO_GRANDE
                mensagem: Arquivo maior que o limite do servidor.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
        '415':
          description: Tipo de arquivo não aceito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: MEDIA_TYPE_NAO_SUPORTADO
                mensagem: Envie o documento em PDF.
                timestamp: '2026-10-16T14:32:07Z'
                id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
        '422':
