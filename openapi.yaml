# =========================================
#              COMPONENTS
# =========================================

components:
  schemas:

    Colaborador:
      type: object
      required:
        - id_setor
        - id_cargo
        - id_jornada_escala
        - matricula
        - nome
        - cpf
        - data_nascimento
        - email
        - telefone
        - data_admissao
        - status
      properties:
        id:
          type: integer
          example: 1
        id_setor:
          type: integer
          example: 1
        id_cargo:
          type: integer
          example: 2
        id_jornada_escala:
          type: integer
          example: 1
        matricula:
          type: string
          maxLength: 12
          example: "COL001"
        nome:
          type: string
          maxLength: 255
          example: "João da Silva"
        cpf:
          type: string
          maxLength: 20
          example: "123.456.789-00"
        data_nascimento:
          type: string
          format: date
          example: "1995-04-15"
        email:
          type: string
          format: email
          maxLength: 255
          example: "joao.silva@empresa.com"
        telefone:
          type: string
          maxLength: 20
          example: "11987654321"
        data_admissao:
          type: string
          format: date
          example: "2024-02-01"
        data_desligamento:
          type: string
          format: date
          nullable: true
          example: null
        status:
          type: string
          maxLength: 30
          enum: [Ativo, Afastado, Desligado]
          example: "Ativo"

    Setor:
      type: object
      required: [nome, descricao, status]
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          maxLength: 100
          example: "Tecnologia da Informação"
        descricao:
          type: string
          maxLength: 255
          example: "Setor responsável pelas soluções tecnológicas."
        status:
          type: boolean
          example: true

    Cargo:
      type: object
      required:
        - nome
        - descricao
        - status
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          maxLength: 150
          example: "Desenvolvedor Full Stack"
        descricao:
          type: string
          maxLength: 255
          example: "Profissional responsável pelo desenvolvimento de aplicações web."
        status:
          type: boolean
          example: true

    JornadaEscala:
      type: object
      required:
        - nome
        - descricao
        - hora_inicio
        - hora_fim
        - status
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          maxLength: 100
          example: "Administrativo"
        descricao:
          type: string
          maxLength: 255
          example: "Jornada administrativa de segunda a sexta."
        hora_inicio:
          type: string
          format: time
          example: "08:00:00"
        hora_fim:
          type: string
          format: time
          example: "17:00:00"
        status:
          type: boolean
          example: true

    DiaSemana:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_jornada_escala:
          type: integer
          example: 1
        dia_semana:
          type: string
          maxLength: 25
          example: "Segunda-feira"
        dia_sigla:
          type: string
          maxLength: 5
          example: "SEG"
        ativo:
          type: boolean
          example: true

    DiaSemanaInput:
      type: object
      required:
        - dia_semana
        - dia_sigla
        - ativo
      properties:
        dia_semana:
          type: string
          maxLength: 25
          example: "Segunda-feira"
        dia_sigla:
          type: string
          maxLength: 5
          example: "SEG"
        ativo:
          type: boolean
          example: true

    Ferias:
      type: object
      required:
        - id_colaborador
        - data_inicio
        - data_fim
        - quantidade_dias
        - status
      properties:
        id:
          type: integer
          example: 1
        id_colaborador:
          type: integer
          example: 1
        data_inicio:
          type: string
          format: date
          example: "2026-12-01"
        data_fim:
          type: string
          format: date
          example: "2026-12-15"
        quantidade_dias:
          type: integer
          example: 15
        status:
          type: string
          maxLength: 35
          example: "Solicitada"
        observacao:
          type: string
          maxLength: 255
          example: "Férias programadas para dezembro."

    Beneficio:
      type: object
      required:
        - nome
        - descricao
        - status
        - disponibilidade
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          maxLength: 100
          example: "Vale Alimentação"
        descricao:
          type: string
          maxLength: 255
          example: "Benefício mensal para alimentação."
        status:
          type: boolean
