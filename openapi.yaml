          nullable: true
        id_motor_regra:
          type: integer
          description: Regra que determinou a classificação.
          example: 2
          nullable: true
    MotorRegra:
      type: object
      description: 'Regra "se média do fator `operador` `valor_referencial` então `classificacao`". Quando mais de uma regra ativa do mesmo fator casa (ex.: média 1,8 satisfaz `<2,00` e `<2,50`), vale a de **menor `valor_referencial`** (mais severa) — critério adotado por este contrato porque o DDL não define precedência.'
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        id_psicossocial_fator:
          type: integer
          description: Fator avaliado pela regra (FK `tbl_psicossocial_fator`) — **não** `avaliacao_fator`.
          minimum: 1
          example: 1
        operador:
          type: string
          description: Operador de comparação (CHECK do banco).
          enum:
          - '='
          - '>'
          - <
          - '>='
          - <=
          - <>
          example: <
        valor_referencial:
          type: number
          description: 'Limite comparado à média do fator na escala 1–5. DECIMAL(4,2): faixa física 0,00–99,99.'
          format: double
          minimum: 0
          maximum: 99.99
          example: 2.5
        classificacao:
          type: string
          description: Rótulo do nível de risco (até 20). A carga usa `PRIORIDADE` e `ATENÇÃO`.
          example: ATENÇÃO
          maxLength: 20
        acao:
          type: string
          description: Ação recomendada, texto livre (até 255).
          example: Monitorar o fator Carga de Trabalho e avaliar necessidade de plano de ação.
          maxLength: 255
        ativo:
          type: boolean
          description: '`false` = ignorada na classificação.'
          default: true
          example: true
      required:
      - id
      - id_psicossocial_fator
      - operador
      - valor_referencial
      - classificacao
      - acao
      - ativo
