    Ferias:
      type: object
      description: Período de férias de um colaborador e seu estágio no fluxo de aprovação.
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        data_inicio:
          type: string
          description: Primeiro dia de férias.
          format: date
          example: '2026-11-02'
        data_fim:
          type: string
          description: Último dia de férias (inclusivo). `>= data_inicio` (CHECK no banco).
          format: date
          example: '2026-11-06'
        quantidade_dias:
          type: integer
          description: Dias corridos **inclusivos** entre início e fim (`2026-11-02`→`2026-11-06` = 5). Calculado pelo servidor; se enviado e divergente, retorna 422.
          minimum: 1
          example: 5
        observacao:
          type: string
          description: Observação do solicitante ou do avaliador.
          example: Solicitação de férias aguardando análise do Gestor.
          maxLength: 255
          nullable: true
        id_colaborador:
          type: integer
          description: Colaborador solicitante.
          example: 1
          readOnly: true
        status:
          type: string
          description: Estágio do fluxo. Só muda via `PATCH /ferias/{id}/status`.
          enum:
          - Pendente
          - Aprovado pelo Gestor
          - Recusado pelo Gestor
          - Aprovado pelo RH
          - Recusado pelo RH
          example: Pendente
          readOnly: true
      required:
      - id
      - data_inicio
      - data_fim
    FeriasInput:
      type: object
      description: 'Período de férias de um colaborador e seu estágio no fluxo de aprovação. Corpo de escrita: campos controlados pelo servidor (id) são ignorados se enviados.'
      properties:
        data_inicio:
          type: string
          description: Primeiro dia de férias.
          format: date
          example: '2026-11-02'
        data_fim:
          type: string
          description: Último dia de férias (inclusivo). `>= data_inicio` (CHECK no banco).
          format: date
          example: '2026-11-06'
        quantidade_dias:
          type: integer
          description: Dias corridos **inclusivos** entre início e fim (`2026-11-02`→`2026-11-06` = 5). Calculado pelo servidor; se enviado e divergente, retorna 422.
          minimum: 1
          example: 5
        observacao:
          type: string
          description: Observação do solicitante ou do avaliador.
          example: Solicitação de férias aguardando análise do Gestor.
          maxLength: 255
          nullable: true
        id_colaborador:
          type: integer
          description: Somente RH pode informar (lançamento em nome de terceiro). Para Colaborador, o servidor usa o titular do token e ignora/rejeita (403) valor diferente.
          minimum: 1
          example: 1
      required:
      - data_inicio
      - data_fim
    FeriasStatusInput:
      type: object
      required:
      - status
      description: 'Transição do fluxo de aprovação. Transições válidas: `Pendente → Aprovado pelo Gestor | Recusado pelo Gestor` (somente Gestor da equipe) e `Aprovado pelo Gestor → Aprovado pelo RH | Recusado pelo RH` (somente RH). Qualquer outra retorna 409 `TRANSICAO_INVALIDA`.'
      properties:
        status:
          type: string
          description: Novo estágio.
          enum:
