  /v1/senai/avalon/pesquisa/{id}/resposta:
    post:
      tags:
      - PESQUISA
      operationId: responderPesquisa
      summary: Enviar respostas da pesquisa (lote atômico)
      description: |-
        Grava, em uma única transação, todas as respostas do titular do token e marca sua participação como concluída. A participação é resolvida pelo servidor; **o corpo não leva identificador de pessoa nem de participação**, e a confirmação devolvida também não.

        Validações: pesquisa vigente e colaborador elegível (senão 404); todas as perguntas obrigatórias presentes (422 `RESPOSTA_OBRIGATORIA_AUSENTE`); `id_pergunta` pertence à pesquisa (422); sem pergunta repetida (UNIQUE `id_participacao`+`id_pergunta`). Reenvio após concluir ⇒ 409 `PESQUISA_JA_RESPONDIDA`.

        **Auditoria:** registra `ENVIO` em `tbl_auditoria` com `identificador_registro = id da pesquisa` e **sem** ids de resposta.

        > Anonimato real: em `tbl_resposta` o vínculo `id_participacao → tbl_participacao.id_colaborador` ainda existe no DDL. Enquanto não houver segregação física (Sprint 4, itens 2.1.6/2.1.7), "anônimo" é garantido só por esta API; quem tiver acesso direto ao banco consegue reidentificar.

        **Perfis autorizados:** Colaborador.
      x-perfis:
      - Colaborador
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
