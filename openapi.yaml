    PlanoAcao:
      type: object
      description: Plano de ação para tratar um risco (tipicamente de um fator psicossocial) em um setor.
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        id_setor:
          type: integer
          description: Setor-alvo do plano (NOT NULL).
          minimum: 1
          example: 1
        id_psicossocial_fator:
          type: integer
          description: 'Fator que originou o plano. Opcional: planos manuais não têm fator.'
          minimum: 1
          example: 1
          nullable: true
        id_colaborador:
          type: integer
          description: Responsável pelo plano. Opcional no banco.
          minimum: 1
          example: 2
          nullable: true
        titulo:
          type: string
          description: Título.
          example: Ação para melhoria da carga de trabalho
          maxLength: 150
        descricao:
          type: string
          description: Descrição (TEXT, NOT NULL).
          example: Revisar a distribuição das atividades e identificar períodos de maior concentração de demandas.
        objetivo:
          type: string
          description: Objetivo mensurável.
          example: Promover uma distribuição mais equilibrada das atividades entre os integrantes.
          maxLength: 500
        data_inicio:
          type: string
          description: Início.
          format: date
          example: '2026-10-05'
        data_fim:
          type: string
          description: Fim (`>= data_inicio`, CHECK).
          format: date
          example: '2026-10-30'
        status:
          type: boolean
          description: '**Divergência aberta:** no DDL é `TINYINT(1)` (`0` = não concluído / `1` = concluído, semântica inferida), mas a carga inicial insere o texto `Em andamento`, que o MySQL rejeita em modo estrito. Este contrato segue o DDL; o script ou a coluna precisam ser corrigidos.'
          default: false
          example: false
      required:
      - id
      - id_setor
      - titulo
      - descricao
      - objetivo
      - data_inicio
      - data_fim
