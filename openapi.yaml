        in: query
        required: false
        description: Filtra por tipo.
        schema:
          type: string
          enum:
          - Contrato
          - Termo
          - Aditivo Contratual
          - Comunicação
          - Recibo
          - Avaliação
          - Documento
          - Política
          - Advertência
          - Rescisão
          - Outros
