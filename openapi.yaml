openapi: 3.0.3
info:
  title: AVALON — Plataforma Integrada de Gestão e Conformidade do Funcionário
  version: 1.2.0
  description: |
    API REST do **AVALON**, plataforma de gestão de pessoas, saúde organizacional e conformidade (NR-1). Atende três clientes: **Web** (RH e Gestor) e **Mobile** (Colaborador), todos consumindo este mesmo contrato.

    O banco `db_tcc_rh` (MySQL 8) é a **fonte de verdade** para nomes, tipos, tamanhos, enums e obrigatoriedade. Onde o DDL e a documentação anterior divergiam, vale o DDL; as divergências estão listadas no fim desta página.

    # Perfis de acesso (RN 12.1.2)

    Existem **somente três perfis**: **Colaborador** (id 1), **Gestor** (id 2) e **RH** (id 3). Não há perfil Administrador na v1. Cada operação indica em **Perfis autorizados** quem pode chamá-la; o servidor valida o perfil em toda requisição, independentemente dos menus exibidos pelo front-end.

    | Módulo | Colaborador | Gestor | RH |
    |---|---|---|---|
    | Autenticação / senha / `/auth/me` / dashboard | sim | sim | sim |
    | Colaboradores | só o próprio cadastro∏ | equipe (CPF mascarado) | CRUD |
    | Setores, Cargos, Jornadas | jornada própria | leitura | CRUD |
    | Férias | solicita, edita e cancela as próprias | decide a 1ª etapa (equipe) | decide a 2ª etapa; lança em nome de terceiros |
    | Benefícios | consulta os próprios | não acessa | CRUD e concessões |
    | Documentos | consulta e baixa os próprios | não acessa | CRUD |
    | Feedbacks | recebe e responde | envia à equipe | todos |
    | Pesquisas | responde | leitura e resultado | CRUD e resultado |
    | Avaliação psicossocial, fatores, Motor de Regras | responde avaliação | não acessa | CRUD e resultados |
    | Planos de ação | não acessa | do próprio setor | CRUD |
    | Indicadores | não acessa | do próprio escopo | todos |
    | Relatórios, usuários, auditoria | não acessa | não acessa | sim |
    | Notificações | as próprias | as próprias | as próprias |

    # Autenticação

    1. `POST /auth/login` devolve `access_token` (JWT, vida curta, `expires_in` em segundos), `refresh_token` (uso único, com rotação), `usuario` e `menus`.
    2. Todas as demais rotas exigem `Authorization: Bearer <access_token>`. As únicas públicas são `/auth/login`, `/auth/refresh`, `/auth/senha/esqueci` e `/auth/senha/redefinir`.
    3. Antes de `expires_in` esgotar, o cliente chama `POST /auth/refresh`.
    4. `POST /auth/logout` revoga a sessão **no servidor**; o token antigo passa a retornar 401.

    Front-end e Mobile podem construir telas a partir deste contrato antes de o Back-end publicar cada endpoint (Planejamento de Sprints, seção 2).

    # Convenções

    * **Base path:** `/v1/senai/avalon`. **Formato:** `application/json; charset=utf-8` (exceto upload de documento, `multipart/form-data`, e download, `application/pdf`).
    * **Datas:** `AAAA-MM-DD`. **Data-hora:** ISO-8601. **Hora:** `HH:MM:SS`. Campos em `snake_case`, iguais às colunas do banco.
    * **Listas:** sempre `200` com array (vazio quando nada atende — nunca 404). Paginação por `?pagina=1&limite=20` (máx. 100); total no header `X-Total-Count`.
    * **Criação:** `201` com o recurso criado e header `Location`. **Atualização (`PUT`):** substitui todos os campos editáveis e devolve `200` com o recurso. **Exclusão:** `204` sem corpo.
    * **Exclusão física x lógica:** as FKs do banco não têm `ON DELETE CASCADE`; excluir algo referenciado retorna `409 REGISTRO_EM_USO`. Para encerrar o uso, desative (`status`/`ativo = false`) ou, no caso de pessoas, inative o colaborador. Documentos usam exclusão lógica.
    * **Campos controlados pelo servidor** (`id`, remetente de feedback, `status` inicial de férias, `caminho_arquivo`, participação do respondente) são ignorados se enviados.
    * **Escopo:** fora do escopo do solicitante a API responde `404`, não `403`, para não revelar a existência do recurso.

    # Erros

    Todo 4xx/5xx usa o envelope `Erro` (`codigo`, `mensagem`, `detalhes[]`, `timestamp`, `caminho`, `id_requisicao`). O cliente decide pelo `codigo`.

    | HTTP | `codigo` | Quando |
    |---|---|---|
    | 400 | `VALIDACAO_FALHOU` | JSON/tipos/formatos inválidos, campo obrigatório ausente |
    | 401 | `TOKEN_INVALIDO` | token ausente, expirado, revogado |
    | 401 | `CREDENCIAIS_INVALIDAS` | login/senha incorretos |
    | 403 | `ACESSO_NEGADO` | perfil sem permissão |
    | 403 | `CONTA_INATIVA` | credencial correta, colaborador inativo |
    | 403 | `K_ANONIMATO_NAO_ATINGIDO` | resultado retido por privacidade |
    | 404 | `RECURSO_NAO_ENCONTRADO` | inexistente ou fora do escopo |
    | 409 | `REGISTRO_DUPLICADO` | violação de UNIQUE (matrícula, CPF, e-mail, login, código…) |
    | 409 | `REGISTRO_EM_USO` | exclusão bloqueada por FK |
    | 409 | `FERIAS_SOBREPOSTAS`, `TRANSICAO_INVALIDA` | conflito de datas; etapa fora de ordem |
    | 409 | `PESQUISA_EM_ANDAMENTO`, `AVALIACAO_EM_ANDAMENTO`, `PESQUISA_JA_RESPONDIDA`, `AVALIACAO_JA_RESPONDIDA`, `PERGUNTA_JA_RESPONDIDA` | alteração após respostas; reenvio |
    | 413 / 415 | `ARQUIVO_MUITO_GRANDE` / `MEDIA_TYPE_NAO_SUPORTADO` | upload |
    | 422 | `REGRA_NEGOCIO_VIOLADA`, `SENHA_ATUAL_INCORRETA`, `TOKEN_REDEFINICAO_INVALIDO`, `COLABORADOR_INELEGIVEL`, `PERGUNTA_FORA_DO_ESCOPO`, `RESPOSTA_OBRIGATORIA_AUSENTE`, `TAREFAS_PENDENTES`, `ULTIMO_RH`, `PUBLICO_SEM_ALVO` | regra de negócio |
    | 429 | `MUITAS_TENTATIVAS` | rotas públicas de autenticação (recomendado) |
    | 500 | `ERRO_INTERNO` | falha inesperada, sem detalhes internos |

    # Privacidade, anonimato e k-anonimato

    * Pesquisas e avaliações com `anonimo=true` **nunca** expõem resposta individual: não há rota que a devolva, o envio é em lote e a confirmação não leva identificadores, e a auditoria não registra ids de resposta.
    * Resultados agregados (`/resultado`, `/relatorio`, `/indicador`) só são liberados quando o grupo tem **no mínimo k respondentes**; abaixo disso a rota responde `403 K_ANONIMATO_NAO_ATINGIDO` ou, em indicadores, devolve `suprimido=true` e métricas `null`. O valor de k é configuração do servidor.
    * Escala psicossocial: inteiros de **1 a 5**; médias e `valor_referencial` do Motor de Regras estão nessa mesma escala (ex.: `< 2,00` ⇒ `PRIORIDADE`).
    * CPF é dado pessoal: completo só para o RH e para o próprio titular; mascarado para o Gestor.
    * Senhas: nunca retornadas; armazenadas somente como hash.

    # Conformidade com o DDL — decisões e divergências corrigidas

    * `Colaborador.tipo_vinculo` (ENUM `CLT`, `PJ`, `ESTÁGIO`, `JOVEM APRENDIZ`, `TEMPORARIO`), `Cargo.codigo`, `Setor.codigo`, `Feedback.data_feedback`, `RespostaFeedback.data_resposta` e `PlanoAcao.id_psicossocial_fator` agora constam no contrato.
    * `Colaborador.status` aceita somente `Ativo` e `Inativo` (CHECK); "Afastado/Desligado" foram removidos. `data_nascimento` e `telefone` são opcionais.
    * `Feedback` tem remetente **e** destinatário; o remetente vem do token.
    * `MotorRegra` aponta para `id_psicossocial_fator` (não para `avaliacao_fator`); `valor_referencial` é DECIMAL(4,2) na escala 1–5.
    * `AvaliacaoPergunta` pertence ao **fator**; a avaliação as obtém pelos fatores vinculados.
    * `Documento.tipo_documento` é ENUM de 11 valores; `caminho_arquivo` (até 500) é gerado pelo servidor.
    * `Pesquisa.titulo`/`Avaliacao.titulo` têm 100 caracteres; `PsicossocialFator.descricao`, 255.
    * `NivelAcesso`, `Menu` e `NivelMenu` são somente leitura; o exemplo "Administrador" foi removido.
    * Férias: `status` ∈ {`Pendente`, `Aprovado pelo Gestor`, `Recusado pelo Gestor`, `Aprovado pelo RH`, `Recusado pelo RH`}.

    # Pendências conhecidas (dependem de decisão da equipe)

    1. **Anonimato no DDL:** `tbl_resposta.id_participacao → tbl_participacao.id_colaborador` permite reidentificar respondentes por JOIN. A segregação física prevista para a Sprint 4 ainda não existe no script.
    2. **Parâmetro k:** não há coluna para o k-anonimato (por pesquisa ou global).
    3. **`tbl_plano_acao.status` é `TINYINT(1)`**, mas a carga inicial insere `'Em andamento'`.
    4. **Senhas semeadas em texto puro** (`'123456'`) em `tbl_usuario`; a carga deve inserir hashes.
    5. **Hierarquia de gestão:** não há `id_gestor`; "equipe" foi definida como "mesmo setor".
    6. **Notificações** não têm `lida` nem data/hora; **Auditoria** exige `id_usuario` (tentativas com login inexistente não são registráveis).
    7. `Colaborador.tipo_vinculo` é nulável no banco; recomenda-se `NOT NULL`.

    # Histórico de revisão

    * **1.2.0** — `securitySchemes` Bearer JWT e `security` global; login com corpo de resposta (tokens, usuário, menus); logout, refresh, `/auth/me`, alterar senha e recuperação de senha; níveis/menus em somente leitura; alinhamento com o DDL; respostas em lote sem identificador; k-anonimato; fluxo de férias em duas etapas; upload de documentos; dashboard, equipe e resultados por fator; envelope de erro único; paginação.
    * **1.1.0** — versão anterior (convergência com o DER v1.1).
