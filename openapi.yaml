        example: APROVACAO
      - name: entidade
        in: query
        required: false
        description: Tabela afetada.
        schema:
          type: string
          maxLength: 100
        example: tbl_ferias
      - name: data_de
        in: query
        required: false
        description: A partir de (inclusivo).
        schema:
          type: string
          format: date
        example: '2026-10-01'
      - name: data_ate
        in: query
        required: false
        description: Até (inclusivo).
        schema:
          type: string
          format: date
        example: '2026-10-31'
      - $ref: '#/components/parameters/Pagina'
      - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Registros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auditoria'
              example:
              - id: 15
                id_usuario: 2
                acao: APROVACAO
                entidade: tbl_ferias
                identificador_registro: 1
                descricao: Férias aprovadas pelo Gestor.
                data_hora: '2026-10-20T14:32:00'
          headers:
            X-Total-Count:
              description: Total de registros que atendem aos filtros (antes da paginação).
              schema:
                type: integer
              example: 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senai/avalon/auditoria/{id}:
    get:
      tags:
      - AUDITORIA
      operationId: buscarAuditoria
      summary: Buscar registro de auditoria
      description: |-
        Retorna o registro pelo id.

        **Perfis autorizados:** RH.
      x-perfis:
      - RH
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Registro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auditoria'
              example:
                id: 15
                id_usuario: 2
                acao: APROVACAO
                entidade: tbl_ferias
                identificador_registro: 1
                descricao: Férias aprovadas pelo Gestor.
                data_hora: '2026-10-20T14:32:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token obtido em `POST /auth/login`. Enviar `Authorization: Bearer <access_token>` em **todas** as rotas, exceto: login, refresh, esqueci-senha e redefinir-senha. Token ausente/expirado/revogado ⇒ 401 `TOKEN_INVALIDO`. Token válido sem permissão ⇒ 403 `ACESSO_NEGADO`.'
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador numérico (PK) do recurso.
      schema:
        type: integer
        minimum: 1
      example: 1
    Pagina:
      name: pagina
      in: query
      required: false
      description: Página (base 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    Limite:
      name: limite
      in: query
      required: false
      description: Itens por página. Máximo 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Requisição malformada ou parâmetro inválido (JSON inválido, tipo errado, id não numérico, campo obrigatório ausente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: VALIDACAO_FALHOU
            mensagem: Um ou mais campos são inválidos.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
            detalhes:
            - campo: data_inicio
              problema: 'Formato esperado: AAAA-MM-DD.'
    Unauthorized:
      description: 'Sem credencial válida: header ausente, token expirado, assinatura inválida ou sessão revogada por logout.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: TOKEN_INVALIDO
            mensagem: Token ausente, expirado ou revogado.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    Forbidden:
      description: Autenticado, mas o perfil (ou o escopo dos dados) não permite a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: ACESSO_NEGADO
            mensagem: Seu perfil não tem permissão para esta operação.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    NotFound:
      description: Recurso inexistente **ou fora do escopo do solicitante** (a API não distingue os dois casos para não vazar existência).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: RECURSO_NAO_ENCONTRADO
            mensagem: Registro não encontrado.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    Conflict:
      description: 'Conflito com o estado atual: UNIQUE violada, FK impede exclusão, transição inválida ou sobreposição de datas.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: REGISTRO_DUPLICADO
            mensagem: Já existe um registro com este valor único.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    Unprocessable:
      description: Sintaxe correta, mas viola regra de negócio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: REGRA_NEGOCIO_VIOLADA
            mensagem: A operação viola uma regra de negócio.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    UnsupportedMedia:
      description: '`Content-Type` diferente do esperado (`application/json` ou `multipart/form-data`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: MEDIA_TYPE_NAO_SUPORTADO
            mensagem: Content-Type inválido.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    TooManyRequests:
      description: Limite de tentativas excedido (recomendado para rotas públicas de autenticação).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: MUITAS_TENTATIVAS
            mensagem: Aguarde antes de tentar novamente.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    ServerError:
      description: Falha inesperada. Corpo sem detalhes internos; use `id_requisicao` para rastrear nos logs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: ERRO_INTERNO
            mensagem: Erro interno no servidor.
            timestamp: '2026-10-16T14:32:07Z'
            id_requisicao: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
  schemas:
    Erro:
      type: object
      description: Envelope único de erro. Toda resposta 4xx/5xx desta API usa este formato; o cliente deve decidir por `codigo`, nunca pelo texto de `mensagem`.
      required:
      - codigo
      - mensagem
      - timestamp
      properties:
        codigo:
          type: string
          description: Código estável, em SNAKE_CASE maiúsculo, para tratamento programático. Catálogo na descrição global da API.
          example: VALIDACAO_FALHOU
        mensagem:
          type: string
          description: Texto legível em pt-BR, seguro para exibir ao usuário final. Nunca contém stack trace, SQL ou nome de coluna.
          example: Um ou mais campos são inválidos.
        detalhes:
          type: array
          items:
            $ref: '#/components/schemas/ErroDetalhe'
          description: 'Presente em erros de validação (400/422): um item por campo inválido.'
        timestamp:
          type: string
          description: Instante do erro em UTC.
          format: date-time
          example: '2026-10-16T14:32:07Z'
        caminho:
          type: string
          description: Path da requisição que falhou.
          example: /v1/senai/avalon/colaborador
        id_requisicao:
          type: string
          description: Correlation-id (também enviado no header `X-Request-Id`). Informe-o ao Back-end ao reportar bugs.
          example: 3f1c9d52-0b7a-4f0e-9a52-6a1d1b7d9e10
    ErroDetalhe:
      type: object
      required:
      - campo
      - problema
      properties:
        campo:
          type: string
          description: Nome do campo no corpo/query, em notação de ponto para objetos aninhados.
          example: cpf
        problema:
          type: string
          description: Regra violada.
          example: CPF já cadastrado para outro colaborador.
    NivelAcesso:
      type: object
      description: 'Perfil de acesso. **Existem exatamente três níveis na versão 1: Colaborador (id 1), Gestor (id 2) e RH (id 3).** Não existe perfil Administrador (RN 12.1.2). A tabela é carga fixa do script SQL e é somente leitura via API.'
      required:
      - id
      - nome
      - status
      properties:
        id:
          type: integer
          description: Identificador.
          example: 3
          readOnly: true
        nome:
          type: string
          description: Nome do nível (UNIQUE no banco).
          enum:
          - Colaborador
          - Gestor
          - RH
          example: RH
        status:
          type: boolean
          description: Nível habilitado.
          example: true
    Menu:
      type: object
      description: Item de navegação do front-end Web/Mobile. A visibilidade por perfil vem de `tbl_nivel_menu`; o servidor continua validando a permissão em cada endpoint — esconder o menu **não** é controle de acesso.
      required:
      - id
      - nome
      - rota
      - ordem
      properties:
        id:
          type: integer
          description: Identificador.
          example: 6
          readOnly: true
        nome:
          type: string
          description: Rótulo exibido (UNIQUE).
          example: Férias
          maxLength: 50
        icone:
          type: string
          description: Chave do ícone consumida pelo front.
          example: icon-ferias
          maxLength: 150
          nullable: true
        rota:
          type: string
          description: Rota do front-end (não é endpoint da API).
          example: /ferias
          maxLength: 255
        ordem:
          type: integer
          description: Posição no menu, crescente.
          example: 6
    NivelMenu:
      type: object
      description: Vínculo nível × menu (UNIQUE por par).
      properties:
        id:
          type: integer
          description: Identificador.
          example: 12
          readOnly: true
        id_nivel_acesso:
          type: integer
          description: FK para tbl_nivel_acesso.
          minimum: 1
          example: 3
        id_menu:
          type: integer
          description: FK para tbl_menu.
          minimum: 1
          example: 6
    LoginInput:
      type: object
      required:
      - login
      - senha
      properties:
        login:
          type: string
          description: Login do usuário (`tbl_usuario.login`, UNIQUE). Diferente da matrícula e do e-mail.
          example: carlos.oliveira
          maxLength: 255
        senha:
          type: string
          description: Senha em texto puro, trafegada somente sobre TLS. O servidor compara contra o hash armazenado e nunca devolve nem registra este valor.
          format: password
          example: S3nh@Forte!2026
          maxLength: 255
    UsuarioResumo:
      type: object
      description: Identidade autenticada.
      required:
      - id
      - login
      - id_colaborador
      - nome
      - nivel_acesso
      properties:
        id:
          type: integer
          description: '`tbl_usuario.id`; é o valor gravado em `tbl_auditoria.id_usuario`.'
          example: 2
        login:
          type: string
          description: Login.
          example: carlos.oliveira
        id_colaborador:
          type: integer
          description: Colaborador dono da conta (1:1).
          example: 2
        nome:
          type: string
          description: Nome do colaborador.
          example: Carlos Eduardo Oliveira
        nivel_acesso:
          $ref: '#/components/schemas/NivelAcesso'
    TokenResposta:
      type: object
      description: 'Credenciais de sessão. Web e Mobile guardam `access_token` apenas em memória (Web) / armazenamento seguro do SO (Mobile) e o enviam em `Authorization: Bearer`.'
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - usuario
      - menus
      properties:
        access_token:
          type: string
          description: Token de acesso (JWT assinado). O cliente deve tratá-lo como opaco; os claims `sub` (id do usuário), `nivel` e `jti` existem para o servidor.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyIiwibml2ZWwiOiJHZXN0b3IifQ.4Kq1
        token_type:
          type: string
          description: Esquema do header Authorization.
          enum:
          - Bearer
          example: Bearer
        expires_in:
          type: integer
          description: Validade do access_token em segundos. O cliente deve renovar com base neste valor e não em constante local.
          minimum: 1
          example: 900
        refresh_token:
          type: string
          description: 'Token opaco de renovação, uso único com rotação: cada `/auth/refresh` devolve um novo e invalida o anterior. Reuso de um refresh já consumido revoga toda a sessão.'
          example: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
        usuario:
          $ref: '#/components/schemas/UsuarioResumo'
        menus:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
          description: Menus liberados ao nível do usuário, já ordenados por `ordem`. Para Colaborador a lista é vazia na carga inicial (nenhum vínculo em `tbl_nivel_menu` para o nível 1; o Colaborador usa o app Mobile).
    RefreshInput:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token vigente.
          example: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
    LogoutInput:
      type: object
      properties:
        refresh_token:
          type: string
          description: Opcional. Se enviado, é revogado junto com o access_token do header. Se omitido, revoga a sessão associada ao access_token.
          example: rt_9b1f0c7e4d2a4c3f8e6a1b5d7c9e2f40
    AlterarSenhaInput:
      type: object
      required:
      - senha_atual
      - nova_senha
      - confirmacao_nova_senha
      properties:
        senha_atual:
          type: string
          description: Senha vigente, reconferida contra o hash.
          format: password
          example: S3nh@Forte!2026
          maxLength: 255
        nova_senha:
          type: string
          description: Nova senha. Mínimo de 8 caracteres assumido por este contrato; ajustar à política da RN de senha se divergir. Deve ser diferente da atual.
          format: password
          minLength: 8
          example: N0va$enha#2026
          maxLength: 255
        confirmacao_nova_senha:
          type: string
          description: Repetição exata de `nova_senha`.
          format: password
          example: N0va$enha#2026
          maxLength: 255
    EsqueciSenhaInput:
      type: object
      required:
      - login
      properties:
        login:
          type: string
          description: Login da conta. O link de redefinição é enviado ao e-mail do colaborador vinculado.
          example: rafael.martins
          maxLength: 255
    RedefinirSenhaInput:
      type: object
      required:
      - token
      - nova_senha
      - confirmacao_nova_senha
      properties:
        token:
          type: string
          description: Token de uso único recebido por e-mail. Expira em janela curta definida pelo servidor.
          example: rst_4c1d0a77b9e84f3c9d2a6e1f
        nova_senha:
          type: string
          description: Nova senha (mesma política de `AlterarSenhaInput`).
          format: password
          minLength: 8
          example: N0va$enha#2026
          maxLength: 255
        confirmacao_nova_senha:
          type: string
          description: Repetição de `nova_senha`.
          format: password
          example: N0va$enha#2026
          maxLength: 255
    Usuario:
      type: object
      description: 'Conta de acesso. Separada de `Colaborador` por decisão de projeto (RN 8): credencial não é dado cadastral. **O campo `senha` nunca é retornado por nenhum endpoint.**'
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        id_colaborador:
          type: integer
          description: 'Colaborador dono da conta. **UNIQUE**: um colaborador tem no máximo um usuário.'
          minimum: 1
          example: 3
        id_nivel_acesso:
          type: integer
          description: Nível de acesso (1 Colaborador, 2 Gestor, 3 RH).
          minimum: 1
          example: 1
        login:
          type: string
          description: Login. **UNIQUE**.
          example: rafael.martins
          maxLength: 255
        colaborador_nome:
          type: string
          description: Nome do colaborador, para listagens.
          example: Rafael Martins
          readOnly: true
      required:
      - id
      - id_colaborador
      - id_nivel_acesso
      - login
    UsuarioInput:
      type: object
      description: 'Conta de acesso. Separada de `Colaborador` por decisão de projeto (RN 8): credencial não é dado cadastral. **O campo `senha` nunca é retornado por nenhum endpoint.** Corpo de escrita: campos controlados pelo servidor (id) são ignorados se enviados.'
      properties:
        id_colaborador:
          type: integer
          description: 'Colaborador dono da conta. **UNIQUE**: um colaborador tem no máximo um usuário.'
          minimum: 1
          example: 3
        id_nivel_acesso:
          type: integer
          description: Nível de acesso (1 Colaborador, 2 Gestor, 3 RH).
          minimum: 1
          example: 1
        login:
          type: string
          description: Login. **UNIQUE**.
          example: rafael.martins
          maxLength: 255
        senha:
          type: string
          description: Senha inicial em texto puro (somente na criação). O servidor persiste apenas hash (bcrypt/argon2); `tbl_usuario.senha` é VARCHAR(255) justamente para comportar o hash. Não pode ser enviada em PUT — use `/auth/senha`.
          format: password
          minLength: 8
          writeOnly: true
          example: Tmp#Inicial2026
          maxLength: 255
      required:
      - id_colaborador
      - id_nivel_acesso
      - login
      - senha
    UsuarioUpdateInput:
      type: object
      description: Atualização de conta. Permite trocar login e nível; **não** aceita `senha` nem `id_colaborador` (vínculo 1:1 imutável).
      required:
      - id_nivel_acesso
      - login
      properties:
        id_nivel_acesso:
          type: integer
          description: Novo nível.
          minimum: 1
          example: 2
        login:
          type: string
          description: Novo login (UNIQUE).
          example: rafael.martins
          maxLength: 255
    Setor:
      type: object
      description: Unidade organizacional. É também a **unidade mínima de agregação** de resultados psicossociais e de pesquisas, logo o tamanho do setor determina o k-anonimato.
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        codigo:
          type: string
          description: Código institucional. **UNIQUE**, até 10 caracteres.
          example: SET002
          maxLength: 10
        nome:
          type: string
          description: Nome do setor.
          example: Tecnologia da Informação
          maxLength: 100
        descricao:
          type: string
          description: Descrição livre.
          example: Setor responsável pela tecnologia e desenvolvimento de sistemas.
          maxLength: 255
          nullable: true
        status:
          type: boolean
          description: '`true` = ativo. Setor inativo não pode receber novos colaboradores, mas o histórico é preservado.'
          default: true
          example: true
      required:
      - id
      - codigo
      - nome
      - status
    SetorInput:
      type: object
      description: 'Unidade organizacional. É também a **unidade mínima de agregação** de resultados psicossociais e de pesquisas, logo o tamanho do setor determina o k-anonimato. Corpo de escrita: campos controlados pelo servidor (id) são ignorados se enviados.'
      properties:
        codigo:
          type: string
          description: Código institucional. **UNIQUE**, até 10 caracteres.
          example: SET002
          maxLength: 10
        nome:
          type: string
          description: Nome do setor.
          example: Tecnologia da Informação
          maxLength: 100
        descricao:
          type: string
          description: Descrição livre.
          example: Setor responsável pela tecnologia e desenvolvimento de sistemas.
          maxLength: 255
          nullable: true
        status:
          type: boolean
          description: '`true` = ativo. Setor inativo não pode receber novos colaboradores, mas o histórico é preservado.'
          default: true
          example: true
      required:
      - codigo
      - nome
      - status
    Cargo:
      type: object
      description: Cargo ocupado por colaboradores. Usado como público-alvo de pesquisas, avaliações e elegibilidade de benefícios.
      properties:
        id:
          type: integer
          description: Identificador interno (AUTO_INCREMENT).
          minimum: 1
          example: 1
          readOnly: true
        codigo:
          type: string
          description: Código institucional. **UNIQUE**, até 10 caracteres.
          example: CAR003
          maxLength: 10
        nome:
          type: string
          description: Nome do cargo.
          example: Desenvolvedor Full Stack
          maxLength: 150
        descricao:
          type: string
          description: Descrição das atribuições.
          example: Responsável pelo desenvolvimento de aplicações web.
          maxLength: 255
          nullable: true
        status:
          type: boolean
          description: '`true` = ativo.'
          default: true
          example: true
      required:
      - id
      - codigo
      - nome
      - status
    CargoInput:
      type: object
      description: 'Cargo ocupado por colaboradores. Usado como público-alvo de pesquisas, avaliações e elegibilidade de benefícios. Corpo de escrita: campos controlados pelo servidor (id) são ignorados se enviados.'
      properties:
        codigo:
          type: string
          description: Código institucional. **UNIQUE**, até 10 caracteres.
