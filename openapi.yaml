      x-perfis:
      - (público)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaInput'
            example:
              login: rafael.martins
      responses:
        '202':
          description: Pedido aceito (sem indicar se o login existe). Corpo vazio.
