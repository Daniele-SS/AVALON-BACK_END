    Auditoria:
      type: object
      description: Registro imutável de ação relevante. Escrito pelo servidor; não existe POST/PUT/DELETE.
      properties:
        id:
          type: integer
          description: Identificador.
          example: 15
        id_usuario:
          type: integer
          description: Usuário (`tbl_usuario.id`) que agiu. NOT NULL no banco ⇒ tentativas de login com login inexistente não podem ser auditadas nesta tabela.
          example: 1
        acao:
          type: string
          description: 'Ação (até 50). Observadas: `LOGIN`, `CRIACAO`, `ATUALIZACAO`, `APROVACAO`, `ENVIO`, `SOLICITACAO`.'
          example: APROVACAO
          maxLength: 50
        entidade:
          type: string
          description: Tabela afetada (até 100), p.ex. `tbl_ferias`.
          example: tbl_ferias
          maxLength: 100
        identificador_registro:
          type: integer
          description: PK do registro afetado. **Nunca** preenchido para `tbl_resposta` / `tbl_avaliacao_resposta` de pesquisas anônimas.
          example: 1
          nullable: true
        descricao:
          type: string
          description: Resumo humano. Não contém senha, token nem conteúdo de respostas.
          example: Férias aprovadas pelo Gestor.
          nullable: true
        data_hora:
          type: string
          description: Instante (DATETIME, default CURRENT_TIMESTAMP).
